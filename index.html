<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS To-Do</title>
<!-- 圖示：瀏覽器分頁、iPhone / Android 加到主畫面 -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00428e">
<style>
  /* ICS 識別色：白底、藍色 #00428e */
  :root {
    --brand: #00428e; --bg: #fff; --card: #fff; --text: #1d1d1f; --muted: #6b7280; --line: #dde3ec;
    --red: #c62828; --red-bg: #fff4f4; --new: #1a7f37;
    --MK: #b54708; --FA: #00428e; --OB: #7a2e98; --ECON: #067647;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  header { background: var(--brand); color: #fff; }
  header div { max-width: 760px; margin: 0 auto; padding: 18px 16px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: .02em; }
  #updated { font-size: 13px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 48px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--brand); text-transform: uppercase; letter-spacing: .05em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  li.urgent { border-color: var(--red); background: var(--red-bg); }
  li input { margin-top: 5px; flex: none; accent-color: var(--brand); }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .summary { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .course { font-weight: 700; font-size: 12px; color: #fff; border-radius: 4px; padding: 0 6px; }
  .due { font-variant-numeric: tabular-nums; }
  li.urgent .due { color: var(--red); font-weight: 600; }
  .new { color: var(--new); font-weight: 700; font-size: 12px; }
  .source { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .title a { color: var(--brand); }
  details summary { cursor: pointer; }
  li.checked { opacity: .5; }
  li.checked .title { text-decoration: line-through; }
  .empty { color: var(--muted); font-size: 14px; }
  #stale { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #fff4e5; color: #8a4b00; border: 1px solid #f5c27a; font-size: 14px; }
</style>
</head>
<body>
<header><div>
  <h1>ICS To-Do</h1>
  <div id="updated"></div>
</div></header>
<main>
  <div id="stale" hidden></div>
  <h2>To do</h2>
  <ul id="todo"></ul>
  <details>
    <summary><h2 style="display:inline">Past</h2></summary>
    <ul id="past"></ul>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
